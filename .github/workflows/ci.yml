name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -S warning tests/test_eb_keep_logs.sh tests/test_metrics.sh tests/test_output_stability.sh tests/test_tutorial_which.sh tests/corpus/run.sh tests/corpus/make-fixtures.sh
      - name: no site names in the tree
        run: |
          ! git grep -nIiE 'snellius|snel-|surf\.nl|/gpfs/|/projects/0|rg\.terra|scratch-shared|scratch-node' -- . ':!.github/workflows/ci.yml'

  zig:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-zig checks the tarball's minisign signature against the Zig
      # project's key.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install promtool 3.7.3
        run: |
          case '${{ runner.arch }}' in
            X64) arch=amd64; sha=fc9e5da126817438cf2820d9a7206c75e3122802ba8d20add3a6219a59ca6913 ;;
            ARM64) arch=arm64; sha=6af448fa4f3640eb9bd51ce71575689a1ef79843b1cf08ef1fcc7ff9a1928bfd ;;
            *) echo 'unsupported runner architecture: ${{ runner.arch }}' >&2; exit 1 ;;
          esac
          archive="prometheus-3.7.3.linux-${arch}.tar.gz"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v3.7.3/${archive}"
          echo "${sha}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          sudo install -m 0755 "prometheus-3.7.3.linux-${arch}/promtool" /usr/local/bin/promtool
      - run: zig fmt --check build.zig build.zig.zon src
      - run: shellcheck -S warning tests/test_cases.sh tests/test_metrics.sh tests/test_why.sh tests/test_json_schemas.sh tests/test_crash_safety.sh tests/test_rotate_fsync_durability.sh tests/lib/check.sh tests/test_report_utf8_safety.sh tests/test_lifecycle_modulerc_safety.sh
      - run: pip install jsonschema
      - uses: ./.github/actions/install-strace
      - run: zig build test --summary all
      - run: zig build -Drelease=true -Dcommit=${{ github.sha }} && zig-out/bin/eb-keep-logs --version
